version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: ./docker/tests/Dockerfile
    container_name: backend_theater_test
    command: [ "pytest", "-c", "/usr/src/config/pytest.ini",
               "-m", "e2e", "--maxfail=5", "--disable-warnings", "-v", "--tb=short"]
    environment:
      - PYTHONPATH=/usr/src/fastapi
      - ENVIRONMENT=testing
      - EMAIL_HOST=mailhog_theater_test
      - EMAIL_PORT=1025
      - EMAIL_HOST_USER=testuser@mate.com
      - EMAIL_HOST_PASSWORD=test_password
      - EMAIL_USE_TLS=False
      - MAILHOG_API_PORT=8025
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
      - MINIO_STORAGE=theater-storage
      - CELERY_BROKER_URL=redis://cinema-redis_test:6379/0
      - CELERY_RESULT_BACKEND=redis://cinema-redis_test:6379/0
    depends_on:
      mailhog:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/usr/src/fastapi
    networks:
      - theater_network_test

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_theater_test
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - theater_network_test

  minio:
    image: minio/minio:latest
    container_name: minio-theater-test
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
      - MINIO_STORAGE=theater-storage
    volumes:
      - minio_data_test:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - theater_network_test

  celery_worker:
    build: .
    container_name: celery_worker_theater_test
    command: celery -A config.celery_app worker -l info
    environment:
      - PYTHONPATH=/usr/src/fastapi
      - CELERY_BROKER_URL=redis://cinema-redis_test:6379/0
      - CELERY_RESULT_BACKEND=redis://cinema-redis_test:6379/0
      - EMAIL_HOST=mailhog_theater_test
      - EMAIL_PORT=1025
    depends_on:
      - redis
    volumes:
      - ./src:/usr/src/fastapi
    networks:
      - theater_network_test

  redis:
    image: redis:7-alpine
    container_name: cinema-redis_test
    command: redis-server --appendonly yes
    volumes:
      - redis_data_test:/data
    networks:
      - theater_network_test

volumes:
  minio_data_test:
  redis_data_test:

networks:
  theater_network_test:
    driver: bridge
